<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>KAMINARI GG</title><style>@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700;800&display=swap');:root {    --cyan: #00ffd5;    --purple: #bc13fe;    --gold: #ffb700;    --gold-bright: #ffea00;    --gold-dark: #7a4a00;    --bg-dark: rgba(10,5,20,.97);    --glass: rgba(15,8,0,.60);}* { box-sizing: border-box; }body {    margin: 0;    font-family: 'Rajdhani', sans-serif;    background: black;    min-height: 100vh;    display: flex;    justify-content: center;    align-items: center;    overflow-y: auto;    padding: 20px 0;    box-sizing: border-box;}#bg-video {    position: fixed;    inset: 0;    width: 100%;    height: 100%;    object-fit: cover;    filter: brightness(.65) contrast(1.05) blur(1.5px);    z-index: -3;}body::before {    content: "";    position: fixed;    inset: 0;    background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,.85));    z-index: -2;}.container {    width: 620px;    height: 820px;    padding: 55px;    border-radius: 45px;    background: var(--glass);    backdrop-filter: blur(22px);    border: 2px solid rgba(255,183,0,.4);    position: relative;    display: flex;    flex-direction: column;    justify-content: space-between;    overflow: hidden;}.container::before {    content: "";    position: absolute;    inset: -50%;    background: conic-gradient(transparent, var(--gold), #ffea00, transparent 30%);    animation: spin 6s linear infinite;    z-index: -1;}.container::after {    content: "";    position: absolute;    inset: 7px;    background: var(--bg-dark);    border-radius: 38px;    z-index: -1;}@keyframes spin {    to { transform: rotate(360deg); }}h3 {    margin: 0 0 25px;    font-size: 46px;    letter-spacing: 4px;    color: #fff;    text-shadow: 0 0 25px #ffea00;    text-align: center;}/* ==============================   INPUTS — sin cambios============================== */.input-box {    height: 72px;    padding: 2px;    border-radius: 16px;    position: relative;    overflow: hidden;    margin-bottom: 30px;    box-shadow: 0 0 22px rgba(255,183,0,.35);    transition: transform .25s ease, box-shadow .25s ease;}.input-box:hover {    transform: scale(1.03);    box-shadow: 0 0 36px rgba(255,183,0,.6);}.input-box::before {    content: "";    position: absolute;    inset: -50%;    background: conic-gradient(        transparent,        var(--gold),        #ffea00,        transparent 25%    );    animation: spin 4s linear infinite;    opacity: .55;    filter: blur(2px);}.input-inner-wrapper {    position: relative;    z-index: 1;    height: 100%;    background: #0a0a0f;    border-radius: 14px;    display: flex;    align-items: center;    padding: 0 22px;}.input-icon {    font-size: 22px;    margin-right: 12px;    color: #ffffff;    filter: none;    transition: transform .25s ease, color .25s ease;}.input-box:focus-within .input-icon {    transform: scale(1.15);    color: var(--gold-bright);    text-shadow: none;}.input-inner {    flex: 1;    background: none;    border: none;    outline: none;    font-size: 18px;    font-weight: 600;    letter-spacing: 1.8px;    text-align: center;    color: #eaeaff;    text-shadow: 0 0 8px rgba(255,183,0,.25);    transition: all .25s ease;}.input-inner::placeholder {    color: rgba(255,255,255,.45);    letter-spacing: 2px;    text-transform: uppercase;}.input-box:focus-within .input-inner {    color: #ffffff;    text-shadow: 0 0 14px rgba(255,183,0,.65);}/* ==============================   BOTÓN LOGIN — MEJORADO   Ahora usa el mismo wrapper de   borde giratorio que los inputs,   con gradiente morado → cyan============================== */.btn-login-wrapper {    height: 72px;    padding: 2px;    border-radius: 16px;    position: relative;    overflow: hidden;    margin-top: 10px;    /* Sombra morada igual que inputs */    box-shadow: 0 0 30px rgba(255,183,0,.65), 0 0 60px rgba(255,220,0,.25);    transition: transform .25s ease, box-shadow .25s ease;    cursor: pointer;}/* Borde giratorio — solo morados oscuro → brillante */.btn-login-wrapper::before {    content: "";    position: absolute;    inset: -50%;    background: conic-gradient(        transparent,        #7a4a00,        #cc8800,        #ffb700,        #ffea00,        #ffb700,        #7a4a00,        transparent 40%    );    animation: spin 3s linear infinite;    filter: blur(1px);}.btn-login-wrapper:hover {    transform: translateY(-3px);    box-shadow: 0 0 65px rgba(255,220,0,1), 0 0 30px rgba(255,234,0,.7);}#btnLogin {    position: relative;    z-index: 1;    width: 100%;    height: 100%;    border: none;    border-radius: 14px;    cursor: pointer;    /* OPCIÓN 4: Brasas doradas oscuras */    background: linear-gradient(        90deg,        #0a0500,        #1f1000,        #3d2200,        #6b3d00,        #9c5c00,        #6b3d00,        #3d2200,        #1f1000,        #0a0500    );    background-size: 400% 100%;    animation: btnGradientMove 2.5s ease-in-out infinite alternate;    font-family: 'Rajdhani', sans-serif;    font-size: 22px;    font-weight: 900;    letter-spacing: 4px;    color: #ffffff;    text-shadow:        0 0 12px rgba(255,255,255,1),        0 0 25px rgba(255,200,0,0.85),        0 0 45px rgba(255,150,0,0.5);    transition: .25s ease;}@keyframes btnGradientMove {    0%   { background-position: 20% 50%; }    100% { background-position: 80% 50%; }}/* ==============================   CONSOLA — original simple============================== */#console {    display: none;    background: black;    border: 2px solid #ffb700;    border-radius: 14px;    padding: 14px;    height: 170px;    overflow-y: auto;    font-family: monospace;    font-size: 15px;    color: #ffd700;    margin-top: 14px;    box-shadow: 0 0 10px rgba(255,183,0,.25);}#accessGranted {    display: none;    margin-top: 14px;    margin-bottom: 8px;    font-size: 24px;    font-weight: 800;    letter-spacing: 3px;    text-align: center;    white-space: nowrap;    /* Gradiente dorado animado igual que el título KAMINARI GG */    background: conic-gradient(        #ffea00,        #ffd700,        #ffb700,        #ff8800,        #ffea00    );    background-size: 300% 300%;    -webkit-background-clip: text;    background-clip: text;    color: transparent;    animation: textSpin 2s linear infinite, flash 1s infinite;    text-shadow: none;    filter: drop-shadow(0 0 12px rgba(255,215,0,.85)) drop-shadow(0 0 25px rgba(255,165,0,.5));}#status {    min-height: 42px;    margin-top: 18px;    display: flex;    align-items: center;    justify-content: center;    font-size: 26px;    font-weight: 900;    text-align: center;    color: #ffffff;    text-shadow: 0 0 18px rgba(255,255,255,.85);}.text-white {    color: #ffffff;    text-shadow: 0 0 18px rgba(255,255,255,.85);}.emoji-error {    color: #ff3b3b;    text-shadow: 0 0 18px rgba(255,59,59,.9);}.emoji-scan {    color: #00eaff;    text-shadow: 0 0 18px rgba(0,234,255,.9);}.emoji-power {    color: #ffd700;    text-shadow: 0 0 18px rgba(255,215,0,.9);}#status .emoji-warning {    color: #ffea00 !important;    text-shadow: 0 0 18px rgba(255,234,0,.9) !important;}/* ==============================   INFO BOX (sesión activa)============================== */.details-box {    position: relative;    padding: 36px;    border-radius: 26px;    background: #050507;    overflow: hidden;}.details-box::before {    content: "";    position: absolute;    inset: -60%;    background: conic-gradient(        transparent,        #7a4a00,        #ffb700,        #ffea00,        #ffb700,        transparent 30%    );    animation: spin 5s linear infinite;    z-index: 0;}.details-box::after {    content: "";    position: absolute;    inset: 4px;    background: #050507;    border-radius: 22px;    z-index: 0;}#details {    position: relative;    z-index: 1;    font-size: 22px;    line-height: 1.6;}#details b {    font-size: 23px;    letter-spacing: 1px;}/* ==============================   BOTÓN LOGOUT — sin cambios============================== */#btnLogout {    margin-top: 22px;    height: 68px;    border: none;    background: none;    cursor: pointer;    position: relative;    padding: 2px;    border-radius: 16px;    overflow: hidden;}#btnLogout::before {    content: "";    position: absolute;    inset: -50%;    background: conic-gradient(transparent, #7a4a00, #ffb700, #ffea00, #ffb700, transparent 25%);    animation: spin 2s linear infinite;}.btn-red-content {    position: relative;    z-index: 1;    background: #1a0e00;    height: 100%;    border-radius: 14px;    display: flex;    align-items: center;    justify-content: center;    font-family: 'Rajdhani', sans-serif;    font-size: 20px;    font-weight: 900;    letter-spacing: 4px;    color: #ffb700;    text-shadow:        0 0 10px rgba(255,183,0,.9),        0 0 25px rgba(255,234,0,.5);}/* ==============================   LAYOUT BOXES============================== */#login-box, #info-box {    display: flex;    flex-direction: column;    justify-content: center;    flex-grow: 1;}#info-box { display: none; }/* ==============================   LOGO / TITLE AREA — sin cambios============================== */.logo-box {    display: flex;    justify-content: center;    margin-bottom: 25px;}.logo-box img {    width: 160px;    max-width: 100%;    height: auto;    filter: drop-shadow(0 0 25px rgba(0,255,213,.6));}.title-container {    position: relative;    margin-bottom: 30px;}.title-wrapper {    position: relative;    background: #000;    border-radius: 20px;    padding-top: 40px;    padding-bottom: 22px;    overflow: hidden;}.title-wrapper::before {    content: "";    position: absolute;    inset: -120%;    background: conic-gradient(        transparent,        #ffea00,        #ffd700,        #ffea00,        transparent 35%    );    animation: spin 5s linear infinite;    z-index: 0;    filter: blur(6px);}.title-wrapper::after {    content: "";    position: absolute;    inset: 3px;    background: #000;    border-radius: 16px;    z-index: 1;}.title-wrapper h3,.logo-box {    position: relative;    z-index: 2;}.logo-box {    position: absolute;    top: -46px;    left: 50%;    transform: translateX(-50%);    pointer-events: none;    z-index: 3;}.kaminari-video {    width: 150px;    height: auto;    mix-blend-mode: screen;    filter: drop-shadow(0 0 30px #ffcc00);}.title-wrapper h3 {    position: relative;    top: -4px;    z-index: 10;}.animated-text {    font-weight: 800;    background: conic-gradient(        #ffea00,        #ffd700,        #ffb700,        #ffea00    );    background-size: 300% 300%;    -webkit-background-clip: text;    background-clip: text;    color: transparent;    animation: textSpin 4s linear infinite;}@keyframes textSpin {    to { background-position: 300% 300%; }}.login-subtitle {    position: absolute;    top: 175px;    left: 50%;    transform: translateX(-50%);    font-size: 24px;    font-weight: 700;    letter-spacing: 6px;    text-transform: uppercase;    background: linear-gradient(90deg, #ffffff, #ffea00, #ffffff);    background-size: 200% 200%;    -webkit-background-clip: text;    background-clip: text;    color: transparent;    animation: accessShine 6s linear infinite;    opacity: .85;    pointer-events: none;    z-index: 5;    white-space: nowrap;}@keyframes accessShine {    0%   { background-position: 0% 50%; }    100% { background-position: 200% 50%; }}.login-subtitle::after {    content: "";    display: block;    width: 90px;    height: 2px;    margin: 12px auto 0;    background: linear-gradient(        90deg,        #ffb700,        #ffea00,        #ff8800,        #ffea00,        #ffb700    );    background-size: 300% 100%;    animation: goldLineMove 4s linear infinite;    box-shadow: 0 0 10px rgba(255,200,0,.6);    opacity: .85;}@keyframes goldLineMove {    from { background-position: 0% 50%; }    to   { background-position: 300% 50%; }}.login-subtitle.hide {    animation: none !important;    opacity: 0;    filter: blur(6px);    visibility: hidden;    transition: none;}@keyframes warningShake {    0%   { transform: translateX(0); }    20%  { transform: translateX(-6px); }    40%  { transform: translateX(6px); }    60%  { transform: translateX(-4px); }    80%  { transform: translateX(4px); }    100% { transform: translateX(0); }}.status-shake {    animation: warningShake .6s ease-in-out;}</style></head><body><video autoplay muted loop playsinline id="bg-video">    <source src="assets/fondo_animado.mp4" type="video/mp4"></video><div class="container">    <div class="title-container">        <div class="title-wrapper">            <h3 class="animated-text">⚡ 宇KAMINARI GG ⚡</h3>        </div>        <div class="login-subtitle">SYSTEM ACCESS</div>        <div class="logo-box">            <video class="kaminari-video" autoplay loop muted playsinline>                <source src="assets/kaminari.mp4" type="video/mp4">            </video>        </div>    </div>    <div id="login-box">        <div class="input-box">            <div class="input-inner-wrapper">                <span class="input-icon">👤</span>                <input id="user" class="input-inner" placeholder="Usuario">                <span class="input-icon" style="opacity:0">👤</span>            </div>        </div>        <div class="input-box">            <div class="input-inner-wrapper">                <span class="input-icon">🔑</span>                <input id="license" type="password" class="input-inner" placeholder="Ingresar Licencia">                <span class="input-icon" style="opacity:0">🔑</span>            </div>        </div>        <!-- BOTÓN MEJORADO: mismo wrapper de borde giratorio que los inputs -->        <div class="btn-login-wrapper">            <button id="btnLogin">ACTIVAR LICENCIA</button>        </div>        <div id="console"></div>        <div id="accessGranted">✅ ACCESO CONCEDIDO ✅</div>    </div>    <div id="info-box">        <div class="details-box">            <div id="details"></div>        </div>        <button id="btnLogout">            <div class="btn-red-content">CERRAR SESIÓN</div>        </button>    </div>    <div id="status"></div></div><script src="scripts/popup.js"></script></body></html>
